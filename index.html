<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSeeker - Sonora</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="glass-container">
        <!-- Add Event & Lang Toggle -->
        <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center;">
            <button class="nav-lang-btn" id="btnAddEvent" style="cursor:pointer; background: rgba(250, 204, 21, 0.2); border-color: rgba(250, 204, 21, 0.4); color: #facc15;">
                <span style="margin-right:4px;">➕</span><span id="btnTextAddEvent">Add Event</span>
            </button>
            <a href="#" class="nav-lang-btn" id="langToggle">
                <span class="lang-flag">🇲🇽</span><span class="lang-text">ES</span>
            </a>
        </div>

        <div class="header">
            <h1>EventSeeker✨</h1>
            <p class="subtitle" id="subtitle">Búsqueda automática de eventos en la H City!</p>

            <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
                <div id="statusBadge" class="update-info">
                    <div class="pulse-dot"></div>
                    <span id="updateText">Next scan: 5AM</span>
                </div>

                <!-- Connection Status -->
                <div class="system-status" id="systemStatus">
                    <div class="status-dot live"></div>
                    <span class="status-text">Live</span>
                </div>

                <!-- NEW Encapsulated Weather Widget -->
                <div id="weatherPill" class="update-info" style="cursor:default;">
                    <span style="font-size:1.2em; margin-right:4px;">☀️</span>
                    <span id="weatherText">Loading...</span>
                </div>
            </div>
        </div>

        <!-- CONTROLS CONTAINER -->
        <div class="controls-wrapper">

            <div class="controls-row">
                <!-- WHERE -->
                <div class="control-group">
                    <span class="control-label" id="lblWhere">Where?</span>
                    <select id="citySelect" class="input-select">
                        <option value="all">All Cities</option>
                        <option value="Hermosillo" selected>Hermosillo, SON</option>
                        <option value="Guaymas">Guaymas / San Carlos, SON</option>
                        <option value="Kino">Bahía de Kino, SON</option>
                        <option value="Nogales">Nogales, SON</option>
                        <option value="Obregon">Cd. Obregón, SON</option>
                        <option value="Tijuana">Tijuana, BC</option>
                        <option value="Tucson">Tucson, AZ</option>
                        <option value="Phoenix">Phoenix, AZ</option>
                    </select>
                </div>

                <!-- WHAT -->
                <div class="control-group">
                    <span class="control-label" id="lblWhat">What?</span>
                    <select id="catSelect" class="input-select">
                        <option value="all">Todo (Todos los tipos)</option>
                        <option value="Conciertos">Conciertos</option>
                        <option value="Fiesta">Fiesta / Vida Nocturna</option>
                        <option value="Cultura">Cultura / Teatro</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Familia">Familiar</option>
                        <option value="General">Otros / General</option>
                    </select>
                </div>
            </div>

            <!-- WHEN -->
            <div class="control-group" style="margin-top:10px;">
                <span class="control-label" id="lblWhen">When?</span>
                <div class="segmented-control">
                    <button class="segment-btn" data-range="today" id="btnToday">Today</button>
                    <button class="segment-btn" data-range="3days" id="btn3Days">Next 3 Days</button>
                    <button class="segment-btn" data-range="7days" id="btn7Days">Next 7 Days</button>
                    <button class="segment-btn active" data-range="30days" id="btnMonth">Next 30 Days</button>
                </div>
            </div>

        </div>

        <!-- RESULTS GRID -->
        <div class="events-list" id="resultsGrid">
            <!-- Events injected here -->
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <!-- hopRadio Cross-Link (From SERGRadio style) -->
        <a href="https://yepzhi.com/hopRadio/" target="_blank" class="hopradio-btn">
            <span>LISTEN</span>
            <span class="hopradio-logo">
                <span class="hop-text">hop</span><span class="radio-text">Radio</span>
            </span>
            <span>→</span>
        </a>

        <!-- Footer Credit (hopRadio style) -->
        <div style="margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:8px;">
            <a href="https://yepzhi.com" target="_blank" class="footer-btn" id="footerBtn">
                <span id="footerLine1">v2.3.2 • ¿Te gusta esto? 💙</span>
                <br>
                <span id="footerLine2" style="font-weight:600; color:#9ca3af;">conoce más aquí</span>
            </a>
            <span style="color:#4b5563; font-size:9px; font-family:monospace; letter-spacing:2px;">Developed by
                @yepzhi</span>
        </div>
    </div>

    <!-- ADD EVENT MODAL -->
    <div class="overlay-modal" id="eventModalOverlay">
        <div class="modal-box">
            <button class="modal-box-close" id="btnModalClose">✕</button>
            <h2 id="modalTitle">New Event</h2>
            <form id="addEventForm">
                <div class="form-group-event">
                    <label id="lblFormTitle">Event Title *</label>
                    <input type="text" id="formTitle" required placeholder="Ej: Concierto de Luis Miguel">
                </div>
                
                <div class="form-row-event">
                    <div class="form-group-event">
                        <label id="lblFormCity">City *</label>
                        <select id="formCity" required>
                            <option value="Hermosillo">Hermosillo, SON</option>
                            <option value="Guaymas">Guaymas / San Carlos, SON</option>
                            <option value="Kino">Bahía de Kino, SON</option>
                            <option value="Nogales">Nogales, SON</option>
                            <option value="Obregon">Cd. Obregón, SON</option>
                            <option value="Tijuana">Tijuana, BC</option>
                            <option value="Tucson">Tucson, AZ</option>
                            <option value="Phoenix">Phoenix, AZ</option>
                        </select>
                    </div>
                    <div class="form-group-event">
                        <label id="lblFormCategory">Category *</label>
                        <select id="formCategory" required>
                            <option value="Conciertos">Conciertos</option>
                            <option value="Fiesta">Fiesta / Vida Nocturna</option>
                            <option value="Cultura">Cultura / Teatro</option>
                            <option value="Deportes">Deportes</option>
                            <option value="Familia">Familiar</option>
                            <option value="General">Otros / General</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-event">
                    <div class="form-group-event">
                        <label id="lblFormStartDate">Start Date *</label>
                        <input type="date" id="formStartDate" required>
                    </div>
                    <div class="form-group-event">
                        <label id="lblFormEndDate">End Date (Optional Range)</label>
                        <input type="date" id="formEndDate">
                    </div>
                </div>

                <div class="form-row-event">
                    <div class="form-group-event">
                        <label id="lblFormTime">Time</label>
                        <input type="text" id="formTime" placeholder="Ej: 8:00 PM">
                    </div>
                    <div class="form-group-event">
                        <label id="lblFormVenue">Venue Name *</label>
                        <input type="text" id="formVenue" required placeholder="Ej: CUM Hermosillo">
                    </div>
                </div>

                <div class="form-group-event">
                    <label id="lblFormDesc">Description</label>
                    <textarea id="formDesc" placeholder="Detalles breves del evento..." maxlength="150"></textarea>
                </div>

                <div class="form-group-event">
                    <label id="lblFormLink">Ticket Link / URL</label>
                    <input type="url" id="formLink" placeholder="https://...">
                </div>

                <button type="submit" class="submit-btn-event" id="btnFormSubmit">Save Event ✦</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="translations.js"></script>
    <script src="app.js"></script>
    <!-- Visitors Unified Tracker -->
    <script>window.NEOSYS_SITE_ID = "eventseeker";</script>
    <script src="https://yepzhi.com/visitors/tracker.js"></script>
</body>

</html>
